; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200            ; must match Serial.begin(115200) or the monitor prints garbage
lib_deps =
    knolleary/PubSubClient@^2.8   ; MQTT client, version-pinned into the project
    h2zero/NimBLE-Arduino@^1.4.3  ; lightweight BLE stack — we run as a BLE *central* to the ELM327
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=0   ; Serial -> hardware UART0 -> the "COM" bridge port (the one you're plugged into)
    -DMQTT_MAX_PACKET_SIZE=512    ; PubSubClient default is 256 — our bundled JSON payload needs headroom
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1  ; we only ever hold one BLE link (the dongle)
    -DBOARD_HAS_PSRAM             ; enable the 8 MB PSRAM on the N16R8 — the store-and-forward ride queue lives there
board_build.partitions = huge_app.csv     ; WiFi+TLS+BLE all linked in overflows the default app partition
; N16R8 = 16 MB QIO flash + 8 MB *octal* (OPI) PSRAM. This memory_type is what makes
; heap_caps_malloc(MALLOC_CAP_SPIRAM) actually return the 8 MB (default def = no PSRAM).
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB

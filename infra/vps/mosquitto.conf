# Toothless Telemetry — public MQTT broker (TLS via Let's Encrypt).
# config-as-code, safe to commit. Runs in Docker on the VPS; the paths below are
# CONTAINER-internal and map to host files via docker-compose.yml volumes.
#
# Security posture: the ONLY publicly-reachable listener is 8883 (TLS) — that is the
# only port published in docker-compose.yml. A broker on a public IP must never accept
# unencrypted auth over the internet. The plaintext 1883 listener below is safe because
# it is NOT published to the host/internet: it lives only on the docker network, reachable
# by in-stack services (Telegraf), and is still authenticated + ACL-scoped like every listener.
#
# IMPORTANT — listener ordering: in mosquitto, TLS options (certfile/keyfile/tls_version)
# apply to the MOST RECENTLY declared `listener`. So the TLS block MUST sit directly under
# `listener 8883`, and `listener 1883` MUST come AFTER it, or the cert binds to the wrong
# listener (symptom: plaintext clients on 1883 get "connection reset by peer", and 8883 loses TLS).
# Auth options below are global (per_listener_settings is not set), so they cover both listeners.

# --- Public listener: TLS only, exposed to the internet (published in docker-compose.yml) ---
listener 8883 0.0.0.0
# No `cafile`: clients authenticate with username/password over TLS, not client certificates,
# so the broker only needs its own cert+key. These are copied in from /etc/letsencrypt by
# deploy-certs.sh (see README) so the container (uid 1883) can read them.
certfile /mosquitto/config/certs/fullchain.pem
keyfile  /mosquitto/config/certs/privkey.pem
tls_version tlsv1.2

# --- Internal listener: plaintext, docker-network only (NOT published) ---
# For in-stack clients (Telegraf reaches this as mosquitto:1883). No TLS options follow it,
# so it stays plaintext. Auth + ACL below still apply to it (they are global).
listener 1883

# --- Authentication + authorization (global — applies to BOTH listeners) ---
allow_anonymous false
password_file /mosquitto/config/passwd
# ACL restricts the authenticated user to its own topic tree (least privilege):
# even a leaked credential can't roam outside toothless/#.
acl_file /mosquitto/config/acl

# --- Persistence: survive restarts (including the brief restart on each cert renewal) ---
persistence true
persistence_location /mosquitto/data/

# --- Logging to stdout so `docker compose logs -f` shows connections, auth results, errors ---
log_dest stdout
log_type all

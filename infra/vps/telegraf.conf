# Toothless Telemetry — the MQTT -> InfluxDB bridge (config-as-code, safe to commit).
#
# Telegraf subscribes to the broker's telemetry topic and writes each message into InfluxDB.
# Both hops stay on the docker network (mosquitto:1883, influxdb:8086) — nothing here is public.
# Secrets (${MQTT_PASSWORD}, ${INFLUX_TOKEN}) come from the container environment, set by
# docker-compose.yml from the gitignored .env — they never appear in this file.
#
# Tuned to the CONFIRMED edge payload (one bundled JSON message per ~1s cycle):
#   {"ts":"2026-09-10T12:50:38Z","source":"esp32","rpm":1372,"speed":0,"throttle":13.3,
#    "engine_load":33.7,"intake_map":55,"coolant_temp":82,"intake_air_temp":49,"module_voltage":14.26}

[agent]
  # Batch writes every 5s; buffer a lot in memory so a brief InfluxDB blip never drops data
  # (a second safety net behind the ESP32's own store-and-forward buffer).
  flush_interval = "5s"
  metric_buffer_limit = 100000

# --- INPUT: subscribe to the broker over the internal plaintext listener ---
[[inputs.mqtt_consumer]]
  servers  = ["tcp://mosquitto:1883"]
  topics   = ["toothless/telemetry"]
  username = "telegraf"
  password = "${MQTT_PASSWORD}"

  # v1 "json" parser (NOT json_v2): the payload is flat, and v1 coerces ALL numbers to
  # float. That sidesteps InfluxDB's per-field type lock — e.g. speed:0 (looks int) and a
  # later speed:12.5 (float) would otherwise be rejected as a type change.
  data_format   = "json"
  name_override = "telemetry"                    # measurement name (default would be "mqtt_consumer")
  tag_keys      = ["source"]                     # "source" is a label to group/filter by -> a TAG

  # The reading carries its OWN timestamp. Honor it so buffered/back-filled data lands at the
  # moment it was recorded, not at ingest time — this is what makes the graph back-fill cleanly.
  json_time_key    = "ts"
  json_time_format = "2006-01-02T15:04:05Z07:00" # RFC3339 (Go reference layout) — matches "...Z"

  # Everything else numeric (rpm, speed, throttle, engine_load, intake_map, coolant_temp,
  # intake_air_temp, module_voltage) becomes a float FIELD automatically.

# --- OUTPUT: write into InfluxDB v2 (in-network, not public) ---
[[outputs.influxdb_v2]]
  urls         = ["http://influxdb:8086"]
  token        = "${INFLUX_TOKEN}"
  organization = "toothless"
  bucket       = "telemetry"

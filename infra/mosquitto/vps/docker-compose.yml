# Toothless Telemetry — public MQTT broker, containerized.
# Deploy on the VPS: `docker compose up -d` from this directory.
#
# Only port 8883 (TLS) is published. `passwd` and `certs/` are secrets generated
# ON THE BOX (never committed — see the repo .gitignore); this file just mounts them.

services:
  mosquitto:
    image: eclipse-mosquitto:2.0.20
    container_name: toothless-mosquitto
    restart: unless-stopped
    ports:
      - "8883:8883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./passwd:/mosquitto/config/passwd:ro
      - ./acl:/mosquitto/config/acl:ro
      - ./certs:/mosquitto/config/certs:ro
      - mosquitto-data:/mosquitto/data

volumes:
  mosquitto-data:

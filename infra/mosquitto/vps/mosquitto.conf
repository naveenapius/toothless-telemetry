# Toothless Telemetry — public MQTT broker (TLS via Let's Encrypt).
# config-as-code, safe to commit. Runs in Docker on the VPS; the paths below are
# CONTAINER-internal and map to host files via docker-compose.yml volumes.
#
# Security posture: the ONLY publicly-reachable listener is 8883 (TLS). There is no
# plaintext listener — a broker on a public IP must never accept unencrypted auth.

listener 8883 0.0.0.0

# --- Authentication + authorization ---
allow_anonymous false
password_file /mosquitto/config/passwd
# ACL restricts the authenticated user to its own topic tree (least privilege):
# even a leaked credential can't roam outside toothless/#.
acl_file /mosquitto/config/acl

# --- TLS (Let's Encrypt server cert) ---
# No `cafile`: clients authenticate with username/password over TLS, not client
# certificates, so the broker only needs its own cert+key. These are copied in from
# /etc/letsencrypt by deploy-certs.sh (see README) so the container (uid 1883) can read them.
certfile /mosquitto/config/certs/fullchain.pem
keyfile  /mosquitto/config/certs/privkey.pem
tls_version tlsv1.2

# --- Persistence: survive restarts (including the brief restart on each cert renewal) ---
persistence true
persistence_location /mosquitto/data/

# --- Logging to stdout so `docker compose logs -f` shows connections, auth results, errors ---
log_dest stdout
log_type all

; GPS isolation rung — prove the u-blox NEO-7M UART link + a satellite fix on its
; own, BEFORE folding lat/lon into the bike firmware. Standalone project on purpose:
; no WiFi/BLE/MQTT, so a wiring/baud/no-fix problem can't hide behind the full stack.
;
; Wiring (confirmed 2026-09-22):
;   ESP32 3V3  -> NEO-7M VCC      (NEO-7M runs at 3.3V; TX idles 3.3V -> no level shifter)
;   ESP32 GND  -> NEO-7M GND
;   ESP32 GPIO17 (RX) <- NEO-7M TX   (data: GPS -> ESP32)
;   ESP32 GPIO18 (TX) -> NEO-7M RX   (config: ESP32 -> GPS, unused for now)

[env:gps-test]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200            ; must match Serial.begin(115200) or the monitor prints garbage
lib_deps =
    mikalhart/TinyGPSPlus@^1.0.3  ; NMEA parser — turns the GPS byte stream into lat/lon/sats/alt
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=0   ; Serial -> hardware UART0 -> the "COM" bridge port (the one you're plugged into)
